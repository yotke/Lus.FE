<div class="register-page" dir="rtl">
  <div class="register-card">
    <div class="register-header">
      <h1 class="register-title">{{ 'common.appName' | translate }}</h1>
      <p class="register-subtitle">{{ 'auth.register.subtitle' | translate }}</p>
    </div>

    <form class="register-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="register-row">
        <app-regular-input class="register-field" [formGroup]="registerForm" [formControlName]="'firstName'"
          [title]="'auth.register.firstName' | translate" [placeholder]="'auth.register.firstName' | translate"
          [autocomplete]="'given-name'"></app-regular-input>

        <app-regular-input class="register-field" [formGroup]="registerForm" [formControlName]="'lastName'"
          [title]="'auth.register.lastName' | translate" [placeholder]="'auth.register.lastName' | translate"
          [autocomplete]="'family-name'"></app-regular-input>
      </div>

      <app-regular-input class="register-field" [formGroup]="registerForm" [formControlName]="'email'"
        [title]="'auth.register.email' | translate" [placeholder]="'auth.login.emailPlaceholder' | translate"
        [inputType]="'email'" [prefixIcon]="'mail'" [autocomplete]="'username'"></app-regular-input>

      <div class="register-row">
        <app-regular-input class="register-field" [formGroup]="registerForm" [formControlName]="'phone'"
          [title]="'auth.register.phone' | translate" [placeholder]="'auth.register.phone' | translate"
          [inputType]="'tel'" [autocomplete]="'tel'"></app-regular-input>

        <app-regular-input class="register-field" [formGroup]="registerForm" [formControlName]="'idNumber'"
          [title]="'auth.register.idNumber' | translate" [placeholder]="'auth.register.idNumber' | translate"></app-regular-input>
      </div>

      <app-regular-input class="register-field" [formGroup]="registerForm" [formControlName]="'password'"
        [title]="'auth.register.password' | translate" [inputType]="hidePassword ? 'password' : 'text'" [prefixIcon]="'lock'"
        [suffixIcon]="hidePassword ? 'eye-off' : 'eye'" (suffixIconClicked)="hidePassword = !hidePassword"
        [autocomplete]="'new-password'"
        [errorMessages]="{ minlength: ('validation.passwordMinLength' | translate), pattern: ('validation.passwordPattern' | translate) }"></app-regular-input>

      <app-regular-input class="register-field" [formGroup]="registerForm" [formControlName]="'confirmPassword'"
        [title]="'auth.register.confirmPassword' | translate" [inputType]="hideConfirmPassword ? 'password' : 'text'" [prefixIcon]="'lock'"
        [suffixIcon]="hideConfirmPassword ? 'eye-off' : 'eye'"
        (suffixIconClicked)="hideConfirmPassword = !hideConfirmPassword"
        [autocomplete]="'new-password'"></app-regular-input>

      <div class="register-mismatch" *ngIf="registerForm.hasError('passwordMismatch') && confirmPassword?.touched">
        {{ 'auth.register.mismatch' | translate }}
      </div>

      <label class="register-terms">
        <mat-checkbox formControlName="acceptTerms" color="primary"></mat-checkbox>
        <span>
          {{ 'auth.register.acceptTermsPrefix' | translate }}<a routerLink="/Terms" target="_blank">{{ 'auth.register.termsLink' | translate }}</a>
          {{ 'auth.register.and' | translate }}<a routerLink="/Privacy" target="_blank">{{ 'auth.register.privacyLink' | translate }}</a>.
        </span>
      </label>
      <div class="register-terms-error" *ngIf="acceptTerms?.hasError('required') && acceptTerms?.touched">
        {{ 'auth.register.termsRequired' | translate }}
      </div>

      <div class="register-error" *ngIf="errorMessage">
        <app-svg-icon name="error" [size]="20"></app-svg-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="register-success" *ngIf="successMessage">
        <app-svg-icon name="check-circle" [size]="20"></app-svg-icon>
        <span>{{ successMessage }}</span>
      </div>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="register-submit"
        [disabled]="isSubmitting"
      >
        <span *ngIf="!isSubmitting">{{ 'auth.register.submit' | translate }}</span>
        <span *ngIf="isSubmitting" class="register-submit-loading">
          <mat-spinner diameter="20"></mat-spinner>
          {{ 'auth.register.submitting' | translate }}
        </span>
      </button>

      <button mat-button type="button" class="register-login-link" (click)="goToLogin()">
        {{ 'auth.register.haveAccount' | translate }}
      </button>
    </form>
  </div>
</div>
