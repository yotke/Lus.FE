<div class="login-page" dir="rtl">
  <div class="login-card">
    <div class="login-header">
      <h1 class="login-title">מערכת לוז</h1>
      <p class="login-subtitle">התחברות למערכת</p>
    </div>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <app-regular-input class="login-field" [formGroup]="loginForm" [formControlName]="'email'"
        [title]="'דוא&quot;ל'" [placeholder]="'name@example.com'" [inputType]="'email'"
        [prefixIcon]="'mail'" [autocomplete]="'username'"></app-regular-input>

      <app-regular-input class="login-field" [formGroup]="loginForm" [formControlName]="'password'"
        [title]="'סיסמה'" [inputType]="hidePassword ? 'password' : 'text'" [prefixIcon]="'lock'"
        [suffixIcon]="hidePassword ? 'eye-off' : 'eye'" (suffixIconClicked)="hidePassword = !hidePassword"
        [autocomplete]="'current-password'"></app-regular-input>

      <div class="login-error" *ngIf="errorMessage">
        <app-svg-icon name="error" [size]="20"></app-svg-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="login-submit"
        [disabled]="isSubmitting"
      >
        <span *ngIf="!isSubmitting">התחברות</span>
        <span *ngIf="isSubmitting" class="login-submit-loading">
          <mat-spinner diameter="20"></mat-spinner>
          מתחבר...
        </span>
      </button>

      <button mat-button type="button" class="login-register-link" routerLink="/Register">
        אין לך חשבון? הרשמה
      </button>

      <div class="login-divider" *ngIf="googleEnabled">
        <span>או</span>
      </div>

      <div class="login-google" *ngIf="googleEnabled">
        <div #googleButton class="login-google-button"></div>
      </div>
    </form>
  </div>
</div>
