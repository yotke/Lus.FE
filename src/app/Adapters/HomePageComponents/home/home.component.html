<section class="home-page-contaier">

    <section class="text-container">
        <h1 dir="rtl">{{ 'home.title' | translate }}</h1>
        <div class="text">
            <p dir="rtl">{{ 'home.lead1' | translate }}</p>
            <p dir="rtl">{{ 'home.lead2' | translate }}</p>
        </div>
        <button (click)="openChooser()" class="home-page-button">{{ 'home.start' | translate }}</button>
    </section>

<app-create-chooser [open]="chooserOpen" (closed)="closeChooser()"
    (chooseClassic)="navigateToTimeManagement()" (chooseAi)="navigateToDocumentBuilder()"></app-create-chooser>

</section>
