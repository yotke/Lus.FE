<header *ngIf="!isScrolledDown" class="black-header">
    <nav class="home-nav-bar">
        <ul>
            <li><a routerLink="/Home" routerLinkActive="active">{{ 'nav.home' | translate }}</a></li>
            <li><a routerLink="./History">{{ 'nav.history' | translate }}</a></li>
            <li><a routerLink="./contact">{{ 'nav.help' | translate }}</a></li>
        </ul>
        <app-month-picker class="system-date" [(selectedValue)]="CurrSystemDate"
            [placeholder]="'nav.currentWorkDate' | translate"
            (selectedValueChange)="onCurrSystemDateChange($event)"></app-month-picker>
        <button type="button" class="theme-toggle-btn" (click)="themeService.toggleDarkMode()"
            [attr.aria-label]="(themeService.isDark ? 'common.themeDay' : 'common.themeNight') | translate"
            [title]="'common.themeToggle' | translate">
            <app-svg-icon [name]="themeService.isDark ? 'wb-sunny' : 'dark-mode'" [size]="22"></app-svg-icon>
        </button>
        <button *ngIf="isLoggedIn$ | async" type="button" class="logout-btn" (click)="logout()"
            [attr.aria-label]="'common.logout' | translate" [title]="'common.logout' | translate">
            <app-svg-icon name="logout" [size]="22"></app-svg-icon>
            <span>{{ 'common.logout' | translate }}</span>
        </button>
        <a href="https://www.google.com" target="_blank">
            <img src="assets/timeLogoVerticalCropWithOutBackGround.png" alt="Timy-Logo - לוגו" />
        </a>
    </nav>
</header>
