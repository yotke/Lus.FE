<div class="btn-save-container">

    <button (click)="onClick()" type="button" color="primary" [title]="title" class="save-btn"
        [style.backgroundColor]="color" [style.color]="color === 'white' ? '#6f6f6f' : 'white'">
        <app-svg-icon name="save" [size]="20"></app-svg-icon>
        {{title}}
    </button>
</div>
