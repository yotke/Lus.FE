<div class="btn-tack-container">
  <button
    (click)="onClick()"
    type="button"
    class="tack-btn"
    [title]="isPined ? 'Unpin' : 'Pin'"
  >
    <app-svg-icon *ngIf="isPined" name="push-pin" [size]="20"></app-svg-icon>
    <app-svg-icon *ngIf="!isPined" class="not-pined" name="push-pin" [size]="20"></app-svg-icon>
  </button>
</div>
