<div class="btn-minus-container">

    <button (click)="onClick()" type="button" color="primary" [title]="title" class="minus-btn"
        [style.backgroundColor]="color" [style.color]="color === 'white' ? '#6f6f6f' : 'white'">
        <app-svg-icon name="remove" [size]="20"></app-svg-icon>
    </button>
</div>
