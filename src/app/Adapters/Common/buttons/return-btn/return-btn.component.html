<div class="btn-return-container">
    <button (click)="onClick()" color="primary" [title]="title" class="return-btn" [style.backgroundColor]="color"
        [style.color]="color === 'white' ? '#6f6f6f' : 'white'">
        <app-svg-icon name="keyboard-return" [size]="20"></app-svg-icon>
    </button>
</div>
