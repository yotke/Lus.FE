<div class="create-chooser-backdrop" *ngIf="open" (click)="closed.emit()">
  <div class="create-chooser-panel" role="dialog" aria-modal="true"
    [attr.aria-label]="'createChooser.title' | translate" (click)="$event.stopPropagation()">

    <div class="create-chooser-header">
      <h2 class="create-chooser-title">{{ 'createChooser.title' | translate }}</h2>
      <p class="create-chooser-subtitle">{{ 'createChooser.subtitle' | translate }}</p>
      <button type="button" class="create-chooser-close" (click)="closed.emit()"
        [attr.aria-label]="'createChooser.close' | translate">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          aria-hidden="true">
          <path
            d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"
            fill="currentColor" />
        </svg>
      </button>
    </div>

    <div class="create-chooser-cards">
      <!-- The manual lane, unchanged: fill the hours in yourself. -->
      <button type="button" class="create-chooser-card" (click)="chooseClassic.emit()">
        <span class="create-chooser-card-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
            <path d="M12 11h4" />
            <path d="M12 16h4" />
            <path d="M8 11h.01" />
            <path d="M8 16h.01" />
          </svg>
        </span>
        <span class="create-chooser-card-title">{{ 'createChooser.classic.title' | translate }}</span>
        <span class="create-chooser-card-desc">{{ 'createChooser.classic.description' | translate }}</span>
      </button>

      <!-- The AI lane: upload an example, talk to it, watch it fill. -->
      <button type="button" class="create-chooser-card create-chooser-card--ai" (click)="chooseAi.emit()">
        <span class="create-chooser-card-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z" />
            <path d="M20 3v4" />
            <path d="M22 5h-4" />
            <path d="M4 17v2" />
            <path d="M5 18H3" />
          </svg>
        </span>
        <span class="create-chooser-card-title">{{ 'createChooser.ai.title' | translate }}</span>
        <span class="create-chooser-card-desc">{{ 'createChooser.ai.description' | translate }}</span>
        <span class="create-chooser-card-badge">{{ 'createChooser.ai.badge' | translate }}</span>
      </button>
    </div>
  </div>
</div>
