<div class="date-container">
    <!-- Top label (above the field) — matches app-regular-input -->
    <mat-label *ngIf="title || showTitle || showLabel" class="date-top-label">{{ title }}</mat-label>

    <mat-form-field *ngIf="control" [ngClass]="combinedClasses" class="date-mat-form-field">
        <input *ngIf="innerValue" type="text" matInput readonly [value]="ShowOnlyMonth(innerValue)"
            [placeholder]="placeholder">
        <input [ngClass]="{'hide-filed':innerValue}" matInput [value]="innerValue" [matDatepicker]="picker"
            [formControl]="control" [placeholder]="placeholder" readonly>
        <mat-datepicker-toggle matSuffix [for]="picker">
            <app-svg-icon matDatepickerToggleIcon name="calendar" [size]="22"></app-svg-icon>
        </mat-datepicker-toggle>
        <mat-datepicker #picker startView="multi-year" (yearSelected)="chosenYearHandler($event)"
            (monthSelected)="chosenMonthHandler($event)">
        </mat-datepicker>
    </mat-form-field>
    <mat-form-field *ngIf="!control" [ngClass]="combinedClasses" class="date-mat-form-field">
        <input *ngIf="innerValue" type="text" matInput readonly [value]="ShowOnlyMonth(innerValue)"
            [placeholder]="placeholder">
        <input [ngClass]="{'hide-filed':innerValue}" matInput [value]="innerValue" [matDatepicker]="picker"
            [(ngModel)]="selectedValue" [placeholder]="placeholder" readonly>
        <mat-datepicker-toggle matSuffix [for]="picker">
            <app-svg-icon matDatepickerToggleIcon name="calendar" [size]="22"></app-svg-icon>
        </mat-datepicker-toggle>
        <mat-datepicker #picker startView="multi-year" (yearSelected)="chosenYearHandler($event)"
            (monthSelected)="chosenMonthHandler($event)">
        </mat-datepicker>
    </mat-form-field>
</div>
